name: Validate research
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/lab.py check --demo
      - run: python3 scripts/lab.py check --output /tmp/prod-site   # production build must also succeed without demo content
